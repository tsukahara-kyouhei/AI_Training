services:
  db2-validation:
    image: icr.io/db2_community/db2:12.1.5.0
    container_name: db2-validation
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: "DB2INST1_PASSWORD"
    volumes:
      - db2-validation-data:/database
      - ./sql/db2-validation:/validation:ro

volumes:
  db2-validation-data:
