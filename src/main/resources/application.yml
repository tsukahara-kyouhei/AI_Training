spring:
  application:
    name: office-order
  datasource:
    url: jdbc:postgresql://localhost:5432/office_order
    username: office_order
    password: office_order
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
  mail:
    host: localhost
    port: 1025
  batch:
    job:
      enabled: false

server:
  port: 8080
  servlet:
    session:
      timeout: 60m

mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  time-zone: Asia/Tokyo
  cookie:
    cart:
      secure-mode: auto
  batch:
    hourly-cron: "0 0 * * * *"
  mail:
    from: no-reply@office-order.local
    reply-to: support@office-order.local
    site-url: http://localhost:8080/
    contact-email: support@office-order.local
