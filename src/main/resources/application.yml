debug: true
spring:
  application:
    name: office-order
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:db2://localhost:50000/office_order}
    username: ${SPRING_DATASOURCE_USERNAME:db2inst1}
    password: ${DB2INST1_PASSWORD}
    driver-class-name: com.ibm.db2.jcc.DB2Driver
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
  mail:
    host: localhost
    port: 1025
  batch:
    job:
      enabled: false

server:
  port: 8080
  servlet:
    session:
      timeout: 60m

mybatis:
  lazy-initialization: true
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  time-zone: Asia/Tokyo
  cookie:
    cart:
      secure-mode: auto
  batch:
    hourly-cron: "0 0 * * * *"
  mail:
    from: no-reply@office-order.local
    reply-to: support@office-order.local
    site-url: http://localhost:8080/
    contact-email: support@office-order.local
