<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout/head :: head('注文情報入力 | OFFICE ORDER', 'commerce')}"></head>

<body>
    <div class="page">
        <div th:replace="~{fragments/layout/header :: header}"></div>
        <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>

        <main class="main">
            <div class="container">
                <div th:replace="~{fragments/common/breadcrumb :: breadcrumb('トップ > 注文情報入力')}"></div>
                <h1 class="page-title">注文情報入力</h1>

                <div class="steps" aria-label="購入ステップ">
                    <span class="step is-active">1. 入力</span>
                    <span class="step">2. 確認</span>
                    <span class="step">3. 完了</span>
                </div>

                <div class="alert" th:if="${checkoutError}" th:text="${checkoutError}" style="margin-bottom:12px;">
                </div>

                <form class="form" th:action="@{/checkout/input}" th:object="${checkoutForm}" method="post">
                    <div class="grid" style="grid-template-columns: 1fr; gap:14px;">
                        <div class="card">
                            <div class="card__pad">
                                <h2 class="section__title" style="margin:0 0 12px;">ご注文者情報</h2>
                                <div class="field">
                                    <label>個人/法人 <span class="req">必須</span></label>
                                    <div class="kvs">
                                        <label class="kv"><input type="radio" th:field="*{personalOrCorporate}"
                                                value="personal"> 個人</label>
                                        <label class="kv"><input type="radio" th:field="*{personalOrCorporate}"
                                                value="corporate"> 法人</label>
                                    </div>
                                    <div class="error" th:if="${#fields.hasErrors('personalOrCorporate')}"
                                        th:errors="*{personalOrCorporate}"></div>
                                </div>
                                <div class="field">
                                    <label>お名前 <span class="req">必須</span></label>
                                    <div class="field__row">
                                        <input type="text" th:field="*{lastName}" placeholder="姓">
                                        <input type="text" th:field="*{firstName}" placeholder="名">
                                    </div>
                                    <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">
                                    </div>
                                    <div class="error" th:if="${#fields.hasErrors('firstName')}"
                                        th:errors="*{firstName}"></div>
                                </div>
                                <div class="field">
                                    <label>お名前（ヨミガナ） <span class="req">必須</span></label>
                                    <div class="field__row">
                                        <input type="text" th:field="*{lastNameKana}" placeholder="セイ">
                                        <input type="text" th:field="*{firstNameKana}" placeholder="メイ">
                                    </div>
                                    <div class="error" th:if="${#fields.hasErrors('lastNameKana')}"
                                        th:errors="*{lastNameKana}"></div>
                                    <div class="error" th:if="${#fields.hasErrors('firstNameKana')}"
                                        th:errors="*{firstNameKana}"></div>
                                </div>
                                <div class="field">
                                    <label>会社名</label>
                                    <input type="text" th:field="*{companyName}" placeholder="法人の場合必須">
                                    <div class="error" th:if="${#fields.hasErrors('companyName')}"
                                        th:errors="*{companyName}"></div>
                                </div>
                                <div class="field">
                                    <label>部署名</label>
                                    <input type="text" th:field="*{departmentName}" placeholder="任意">
                                    <div class="error" th:if="${#fields.hasErrors('departmentName')}"
                                        th:errors="*{departmentName}"></div>
                                </div>
                                <div class="field">
                                    <label>メールアドレス <span class="req">必須</span></label>
                                    <input type="email" th:field="*{email}" placeholder="example@example.com">
                                    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                <div class="field">
                                    <label>電話番号 <span class="req">必須</span></label>
                                    <input type="text" th:field="*{daytimePhone}" placeholder="ハイフンなし（数字10〜12桁）">
                                    <div class="error" th:if="${#fields.hasErrors('daytimePhone')}"
                                        th:errors="*{daytimePhone}"></div>
                                </div>
                                <div class="field">
                                    <label>FAX</label>
                                    <input type="text" th:field="*{fax}" placeholder="任意（数字10〜12桁）">
                                    <div class="error" th:if="${#fields.hasErrors('fax')}" th:errors="*{fax}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card__pad">
                                <div class="section__head" style="margin-bottom:12px; align-items:flex-end;">
                                    <h2 class="section__title" style="margin:0;">お届け先情報</h2>
                                    <div th:if="${isMemberCheckout and hasCheckoutAdditionalAddresses}" class="field"
                                        style="margin:0; min-width:320px;">
                                        <select th:field="*{selectedAdditionalAddressId}"
                                            id="selectedAdditionalAddressId">
                                            <option value="">登録済みお届け先から入力</option>
                                            <option th:each="address : ${checkoutAdditionalAddresses}"
                                                th:value="${address.memberAddressId()}"
                                                th:text="${address.addressSummary()}" th:attr="data-postal=${address.postalCode()},
                                                         data-prefecture=${address.prefecture()},
                                                         data-city=${address.city()},
                                                         data-address-line=${address.addressLine()},
                                                         data-floor=${address.deliveryFloor()},
                                                         data-elevator=${address.hasElevator()},
                                                         data-daytime-phone=${address.daytimePhone()},
                                                         data-fax=${address.fax()}">
                                                〒1000001 東京都千代田区...
                                            </option>
                                        </select>
                                        <div class="error" th:if="${#fields.hasErrors('selectedAdditionalAddressId')}"
                                            th:errors="*{selectedAdditionalAddressId}"></div>
                                    </div>
                                </div>
                                <div class="field">
                                    <label>郵便番号 <span class="req">必須</span></label>
                                    <div class="field__row--zip">
                                        <input class="input--zip3 input--fit" type="text" th:field="*{postalCodePart1}"
                                            inputmode="numeric" maxlength="3">
                                        <span class="zip-sep">-</span>
                                        <input class="input--zip4 input--fit" type="text" th:field="*{postalCodePart2}"
                                            inputmode="numeric" maxlength="4">
                                    </div>
                                    <div class="error" th:if="${#fields.hasErrors('postalCodePart1')}"
                                        th:errors="*{postalCodePart1}"></div>
                                    <div class="error" th:if="${#fields.hasErrors('postalCodePart2')}"
                                        th:errors="*{postalCodePart2}"></div>
                                </div>
                                <div class="field">
                                    <label>住所（都道府県） <span class="req">必須</span></label>
                                    <input type="text" th:field="*{prefecture}">
                                    <div class="error" th:if="${#fields.hasErrors('prefecture')}"
                                        th:errors="*{prefecture}"></div>
                                </div>
                                <div class="field">
                                    <label>住所（市区町村名） <span class="req">必須</span></label>
                                    <input type="text" th:field="*{city}">
                                    <div class="error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                                </div>
                                <div class="field">
                                    <label>住所（番地・ビル名） <span class="req">必須</span></label>
                                    <input type="text" th:field="*{addressLine}">
                                    <div class="error" th:if="${#fields.hasErrors('addressLine')}"
                                        th:errors="*{addressLine}"></div>
                                </div>
                                <div class="field">
                                    <label>お届け先階数 <span class="req">必須</span></label>
                                    <div class="field__inline">
                                        <input class="input--floor input--fit" type="text" th:field="*{deliveryFloor}"
                                            inputmode="numeric" pattern="[0-9]*">
                                        <span>階</span>
                                    </div>
                                    <div class="error" th:if="${#fields.hasErrors('deliveryFloor')}"
                                        th:errors="*{deliveryFloor}"></div>
                                </div>
                                <div class="field">
                                    <label>エレベーターの有無 <span class="req">必須</span></label>
                                    <div class="kvs">
                                        <label class="kv"><input type="radio" th:field="*{hasElevator}" value="true">
                                            あり</label>
                                        <label class="kv"><input type="radio" th:field="*{hasElevator}" value="false">
                                            なし</label>
                                    </div>
                                    <div class="error" th:if="${#fields.hasErrors('hasElevator')}"
                                        th:errors="*{hasElevator}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card__pad">
                                <h2 class="section__title" style="margin:0 0 12px;">決済手段</h2>
                                <div class="field">
                                    <label>決済手段 <span class="req">必須</span></label>
                                    <div class="kvs">
                                        <label class="kv"><input type="radio" th:field="*{paymentMethod}"
                                                value="bank_transfer"> 銀行振込</label>
                                        <label class="kv"><input type="radio" th:field="*{paymentMethod}"
                                                value="cash_on_delivery"> 代金引換</label>
                                        <label class="kv"><input type="radio" th:field="*{paymentMethod}"
                                                value="convenience_store"> コンビニ決済</label>
                                    </div>
                                    <div class="help">コンビニ決済の場合は注文完了画面に支払案内を表示します。</div>
                                    <div class="error" th:if="${#fields.hasErrors('paymentMethod')}"
                                        th:errors="*{paymentMethod}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="actions" style="justify-content:flex-end;">
                            <a class="btn" href="/cart">カートへ戻る</a>
                            <button class="btn btn--cart-action" type="submit">確認画面に進む</button>
                        </div>
                    </div>
                </form>

            </div>
        </main>

        <div th:replace="~{fragments/layout/footer :: footer}"></div>
    </div>
    <th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>

</html>
