<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout/head :: head('ログイン | OFFICE ORDER', 'commerce')}"></head>
<body>
<div class="page">
    <div th:replace="~{fragments/layout/header :: header}"></div>
    <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>

    <main class="main">
        <div class="container">
            <div th:replace="~{fragments/common/breadcrumb :: breadcrumb('トップ > ログイン')}"></div>
            <h1 class="page-title">ログイン</h1>

            <div class="checkout-method-layout">
                <div class="card">
                    <div class="card__pad">
                        <p class="footer__title" style="margin:0 0 6px;">会員のお客様</p>
                        <p class="muted" style="margin:0 0 14px; line-height:1.7;">
                            ご登録のメールアドレスとパスワードでログインしてください。
                        </p>
                        <div class="alert" th:if="${sessionExpired}" style="margin-bottom:12px;">
                            セッションの有効期限が切れました。再度ログインしてください。
                        </div>
                        <div class="alert" th:if="${param.error}" style="margin-bottom:12px;">
                            メールアドレスまたはパスワードが正しくありません。
                        </div>
                        <form class="form" aria-label="ログインフォーム" th:action="@{/login}" th:object="${loginForm}" method="post">
                            <div class="field">
                                <label>メールアドレス <span class="req">必須</span></label>
                                <input type="email" th:field="*{email}" tabindex="1">
                                <label class="check-item" style="margin-top:8px;">
                                    <input type="checkbox" name="remember_me" value="1" th:checked="${rememberLoginEmail}" tabindex="4">
                                    次回から入力を省略する
                                </label>
                                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="field">
                                <label>パスワード <span class="req">必須</span></label>
                                <input id="login-password" type="password" th:field="*{password}" tabindex="2">
                                <label class="check-item" style="margin-top:8px;">
                                    <input type="checkbox" data-password-toggle data-target="login-password" tabindex="5">
                                    パスワード表示
                                </label>
                                <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>
                            <input type="hidden" th:field="*{redirectPath}">
                            <button class="btn btn--cart-action" type="submit" style="width:100%;" tabindex="3">ログイン</button>
                        </form>
                    </div>
                </div>

                <div class="checkout-method-right">
                    <div class="card">
                        <div class="card__pad">
                            <p class="footer__title" style="margin:0 0 6px;">はじめてのご利用・未登録のお客様</p>
                            <p class="muted" style="margin:0 0 14px; line-height:1.7;">
                                会員登録すると購入履歴やお気に入り機能をご利用いただけます。
                            </p>
                            <a class="btn btn--cart-action" href="/members/register" style="width:100%;">会員登録して購入</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>
</div>
<th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>
</html>
