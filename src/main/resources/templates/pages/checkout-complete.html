<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout/head :: head('注文完了 | OFFICE ORDER', 'commerce')}"></head>

<body>
    <div class="page">
        <div th:replace="~{fragments/layout/header :: header}"></div>
        <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>

        <main class="main">
            <div class="container">
                <div th:replace="~{fragments/common/breadcrumb :: breadcrumb('トップ > 注文完了')}"></div>
                <h1 class="page-title">注文完了</h1>

                <div class="steps" aria-label="購入ステップ">
                    <span class="step">1. 入力</span>
                    <span class="step">2. 確認</span>
                    <span class="step is-active">3. 完了</span>
                </div>

                <div class="card">
                    <div class="card__pad">
                        <div class="kvs">
                            <span class="kv">注文番号: <strong
                                    th:text="${order.orderNumber}">ORD20260216-0001</strong></span>
                        </div>
                        <p class="muted" style="margin:12px 0 0; line-height:1.8;">
                            ご注文ありがとうございました。注文完了メールを送信しました。
                        </p>
                    </div>
                </div>

                <section class="section" aria-label="注文情報">
                    <div class="section__head">
                        <h2 class="section__title">注文情報</h2>
                    </div>
                    <div class="card">
                        <div class="card__pad">
                            <table class="table">
                                <tbody>
                                    <tr>
                                        <th style="width:220px;">ご注文者</th>
                                        <td th:text="${order.customerLastName + ' ' + order.customerFirstName}">山田 太郎
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>メールアドレス</th>
                                        <td th:text="${order.customerEmail}">guest001@example.com</td>
                                    </tr>
                                    <tr>
                                        <th>決済手段</th>
                                        <td th:text="${order.paymentMethodLabel}">銀行振込</td>
                                    </tr>
                                    <tr>
                                        <th>郵便番号</th>
                                        <td
                                            th:text="${#strings.length(order.shippingPostalCode) == 7 ? #strings.substring(order.shippingPostalCode,0,3) + '-' + #strings.substring(order.shippingPostalCode,3,7) : order.shippingPostalCode}">
                                            100-0001</td>
                                    </tr>
                                    <tr>
                                        <th>住所</th>
                                        <td
                                            th:text="${order.shippingPrefecture + order.shippingCity + order.shippingAddressLine}">
                                            東京都千代田区丸の内1-1-1</td>
                                    </tr>
                                    <tr>
                                        <th>お届け先階数</th>
                                        <td th:text="${order.shippingFloor + '階'}">5階</td>
                                    </tr>
                                    <tr>
                                        <th>エレベーター</th>
                                        <td th:text="${order.shippingHasElevator ? 'あり' : 'なし'}">あり</td>
                                    </tr>
                                    <tr>
                                        <th>合計（税込）</th>
                                        <td><strong th:text="${order.totalAmountText + '円'}">43,340円</strong></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <section class="section" aria-label="コンビニ決済案内" th:if="${order.convenienceStorePayment}">
                    <div class="section__head">
                        <h2 class="section__title">コンビニ決済の支払案内</h2>
                    </div>
                    <div class="card">
                        <div class="card__pad">
                            <div class="kvs">
                                <span class="kv">受付番号: <strong
                                        th:text="${order.convenienceStorePaymentNumber}">123456</strong></span>
                                <span class="kv">支払期限: <strong
                                        th:text="${order.convenienceStorePaymentDueDate}">2026-02-19</strong></span>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="actions" style="margin-top:14px;">
                    <a class="btn btn--primary" href="/">トップへ戻る</a>
                    <a class="btn" href="/mypage/orders">購入履歴を見る（会員）</a>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/layout/footer :: footer}"></div>
    </div>
    <th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>

</html>
