<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout/head :: head('退会手続き | OFFICE ORDER', 'account')}"></head>

<body class="is-logged-in">
    <div class="page">
        <div th:replace="~{fragments/layout/header :: header}"></div>
        <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>
        <main class="main">
            <div class="container">
                <div th:replace="~{fragments/common/breadcrumb :: breadcrumb('トップ > マイページ > 退会手続き')}"></div>
                <h1 class="page-title">退会手続き</h1>

                <div class="mypage">
                    <aside aria-label="マイページメニュー">
                        <div class="card">
                            <div class="card__pad">
                                <div class="navlist">
                                    <a class="navitem" href="/mypage/orders">購入履歴</a>
                                    <a class="navitem" href="/mypage/favorites">お気に入り</a>
                                    <a class="navitem" href="/mypage/profile">会員登録内容変更</a>
                                    <a class="navitem" href="/mypage/addresses">お届け先管理</a>
                                    <a class="navitem is-active" href="/mypage/withdraw">退会手続き</a>
                                    <form class="navitem-form" th:action="@{/logout}" method="post">
                                        <button class="navitem navitem--button" type="submit">ログアウト</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </aside>

                    <section aria-label="退会確認">
                        <div class="card">
                            <div class="card__pad">
                                <div class="alert" style="margin-bottom:12px;">
                                    退会するとログインできなくなります。購入履歴・お気に入りの参照もできません。
                                </div>
                                <div class="actions">
                                    <form th:action="@{/mypage/withdraw}" method="post" style="margin:0;">
                                        <button class="btn btn--cart-action" type="submit">退会する</button>
                                    </form>
                                    <a class="btn" href="/mypage/orders">キャンセル</a>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/layout/footer :: footer}"></div>
    </div>
    <th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>

</html>
