<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout/head :: head('トップ | OFFICE ORDER', 'top')}"></head>
<body>
<div class="page">
    <div th:replace="~{fragments/layout/header :: header}"></div>
    <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>

    <main class="main">
        <section class="hero hero--wide" aria-label="サービス概要">
            <div class="container">
                <h1 class="hero__title">オフィス家具を、必要なときに、必要なだけ。</h1>
                <p class="hero__desc">
                    OFFICE ORDER は、デスク・チェア・収納家具を中心に、オフィスの立ち上げや<br>
                    増席に必要な家具をオンラインで注文できるECサイトです。<br>
                    必要な時に必要な数量を、わかりやすく選んで導入できる体験を提供します。
                </p>
            </div>
        </section>

        <div class="container">
            <section class="section" aria-label="カテゴリから探す">
                <div class="section__head">
                    <h2 class="section__title">カテゴリから探す</h2>
                </div>
                <div class="grid grid--3">
                    <a class="card cat-card" href="/categories/desks">
                        <div class="card__pad cat-card__pad">
                            <span class="material-icons cat-card__icon" aria-hidden="true">table_bar</span>
                            <span class="cat-card__label">デスク</span>
                        </div>
                    </a>
                    <a class="card cat-card" href="/categories/chairs">
                        <div class="card__pad cat-card__pad">
                            <span class="material-icons cat-card__icon" aria-hidden="true">chair</span>
                            <span class="cat-card__label">チェア</span>
                        </div>
                    </a>
                    <a class="card cat-card" href="/categories/storages">
                        <div class="card__pad cat-card__pad">
                            <span class="material-icons cat-card__icon" aria-hidden="true">inventory</span>
                            <span class="cat-card__label">収納家具</span>
                        </div>
                    </a>
                </div>
            </section>

            <section class="section" aria-label="新着商品">
                <div class="section__head">
                    <h2 class="section__title">新着商品</h2>
                    <a class="btn btn--ghost" href="/products/new-arrivals">もっと見る</a>
                </div>
                <div class="card" th:if="${!hasTopNewArrivals}">
                    <div class="card__pad">
                        <p class="muted" style="margin:0;">現在ご案内できる新着商品はありません。</p>
                    </div>
                </div>
                <div class="grid grid--4" th:if="${hasTopNewArrivals}">
                    <th:block th:each="product : ${topNewArrivals}">
                        <div th:replace="~{fragments/common/product-card :: productCardByView(${product})}"></div>
                    </th:block>
                </div>
            </section>

            <section class="section" aria-label="売れ筋ランキング">
                <div class="section__head">
                    <h2 class="section__title">売れ筋ランキング</h2>
                </div>
                <div class="card" th:if="${topRankedProducts == null or #lists.isEmpty(topRankedProducts)}">
                    <div class="card__pad">
                        <p class="muted" style="margin:0;">現在ご案内できる売れ筋ランキングはありません。</p>
                    </div>
                </div>
                <div class="carousel" data-carousel th:if="${topRankedProducts != null and !#lists.isEmpty(topRankedProducts)}">
                    <button class="carousel__btn carousel__btn--prev" type="button" aria-label="前へ" data-carousel-prev>
                        <span class="material-icons" aria-hidden="true">chevron_left</span>
                    </button>
                    <div class="carousel__viewport">
                        <div class="carousel__track" data-carousel-track>
                            <div class="carousel__item" data-carousel-item
                                 th:each="ranked : ${topRankedProducts}">
                                <div th:replace="~{fragments/common/product-card :: rankedProductCardByView(${ranked})}"></div>
                            </div>
                        </div>
                    </div>
                    <button class="carousel__btn carousel__btn--next" type="button" aria-label="次へ" data-carousel-next>
                        <span class="material-icons" aria-hidden="true">chevron_right</span>
                    </button>
                </div>
            </section>

        </div>
    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>
</div>
<th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>
</html>
