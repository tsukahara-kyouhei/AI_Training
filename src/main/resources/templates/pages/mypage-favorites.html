<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout/head :: head('お気に入り一覧 | OFFICE ORDER', 'account')}"></head>

<body class="is-logged-in">
    <div class="page">
        <div th:replace="~{fragments/layout/header :: header}"></div>
        <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>
        <main class="main">
            <div class="container">
                <div th:replace="~{fragments/common/breadcrumb :: breadcrumb('トップ > マイページ > お気に入り')}"></div>
                <h1 class="page-title">お気に入り</h1>

                <div class="mypage">
                    <aside aria-label="マイページメニュー">
                        <div class="card">
                            <div class="card__pad">
                                <div class="navlist">
                                    <a class="navitem" href="/mypage/orders">購入履歴</a>
                                    <a class="navitem is-active" href="/mypage/favorites">お気に入り</a>
                                    <a class="navitem" href="/mypage/profile">会員登録内容変更</a>
                                    <a class="navitem" href="/mypage/addresses">お届け先管理</a>
                                    <a class="navitem" href="/mypage/withdraw">退会手続き</a>
                                    <form class="navitem-form" th:action="@{/logout}" method="post">
                                        <button class="navitem navitem--button" type="submit">ログアウト</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </aside>

                    <section aria-label="お気に入り一覧（20件/ページ）">
                        <div class="card">
                            <div class="card__pad">
                                <div class="toolbar" style="margin-top:0;">
                                    <div class="toolbar__group">
                                        <span class="badge"
                                            th:text="'登録数: ' + ${favoriteCount} + ' / ' + ${favoriteLimit}">登録数: 10 /
                                            100</span>
                                    </div>
                                </div>
                                <div class="error" th:if="${favoriteLimitError}" th:text="${favoriteLimitError}"
                                    style="margin:0 0 8px;"></div>
                                <div class="card" th:if="${#lists.isEmpty(favorites)}">
                                    <div class="card__pad">
                                        <p class="muted" style="margin:0;">お気に入りはまだありません。</p>
                                        <a class="btn btn--ghost" href="/" style="margin-top:10px;">商品を探す</a>
                                    </div>
                                </div>
                                <div class="grid grid--3" th:if="${!#lists.isEmpty(favorites)}">
                                    <div class="card favorite-card" th:each="favorite : ${favorites}">
                                        <div
                                            th:replace="~{fragments/common/product-card :: productCardByView(${favorite})}">
                                        </div>
                                        <div class="card__pad favorite-card__actions">
                                            <form
                                                th:action="@{/products/{productId}/favorite(productId=${favorite.productId})}"
                                                method="post">
                                                <input type="hidden" name="action" value="remove">
                                                <input type="hidden" name="redirect"
                                                    th:value="@{/mypage/favorites(page=${currentPage})}">
                                                <button class="icon-btn" type="submit" aria-label="お気に入りから削除">
                                                    <span class="material-icons" aria-hidden="true">delete</span>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>

                                <nav aria-label="ページネーション" th:if="${totalPages > 1}"
                                    style="display:flex; gap:8px; align-items:center; justify-content:center; margin-top:16px;">
                                    <a class="btn btn--ghost" th:if="${currentPage > 1}"
                                        th:href="@{/mypage/favorites(page=${currentPage - 1})}">前へ</a>
                                    <span class="btn btn--ghost is-disabled" th:if="${currentPage <= 1}">前へ</span>

                                    <a class="btn btn--ghost" th:each="p : ${#numbers.sequence(1, totalPages)}"
                                        th:classappend="${p == currentPage} ? ' is-disabled' : ''"
                                        th:href="@{/mypage/favorites(page=${p})}" th:text="${p}">1</a>

                                    <a class="btn btn--ghost" th:if="${currentPage < totalPages}"
                                        th:href="@{/mypage/favorites(page=${currentPage + 1})}">次へ</a>
                                    <span class="btn btn--ghost is-disabled"
                                        th:if="${currentPage >= totalPages}">次へ</span>
                                </nav>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/layout/footer :: footer}"></div>
    </div>
    <th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>

</html>
