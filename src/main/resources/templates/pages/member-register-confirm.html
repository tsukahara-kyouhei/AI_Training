<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout/head :: head('会員登録確認 | OFFICE ORDER', '')}"></head>
<body>
<div class="page">
    <div th:replace="~{fragments/layout/header :: header}"></div>
    <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>

    <main class="main">
        <div class="container">
            <div th:replace="~{fragments/common/breadcrumb :: breadcrumb('トップ > 会員登録 > 会員登録確認')}"></div>
            <h1 class="page-title">会員登録確認</h1>

            <div class="card">
                <div class="card__pad">
                    <table class="table" aria-label="会員登録入力内容確認">
                        <tbody>
                        <tr><th style="width:240px;">個人/法人</th><td th:text="${registerForm.personalOrCorporateLabel}">個人</td></tr>
                        <tr><th>お名前</th><td th:text="${registerForm.lastName + ' ' + registerForm.firstName}">山田 太郎</td></tr>
                        <tr><th>お名前（ヨミガナ）</th><td th:text="${registerForm.lastNameKana + ' ' + registerForm.firstNameKana}">ヤマダ タロウ</td></tr>
                        <tr><th>会社名</th><td th:text="${#strings.isEmpty(registerForm.companyName) ? '-' : registerForm.companyName}">-</td></tr>
                        <tr><th>部署名</th><td th:text="${#strings.isEmpty(registerForm.departmentName) ? '-' : registerForm.departmentName}">-</td></tr>
                        <tr><th>メールアドレス</th><td th:text="${registerForm.email}">sample@example.com</td></tr>
                        <tr><th>性別</th><td th:text="${registerForm.genderLabel}">男性</td></tr>
                        <tr><th>生年月日/記念日</th><td th:text="${registerForm.anniversaryDate}">1990-05-10</td></tr>
                        <tr><th>パスワード</th><td>********</td></tr>
                        <tr><th>メールマガジンの送付希望</th><td th:text="${registerForm.newsletterOptInLabel}">希望する</td></tr>
                        <tr><th>郵便番号</th><td th:text="${registerForm.postalCodeDisplay}">100-0001</td></tr>
                        <tr><th>住所（都道府県）</th><td th:text="${registerForm.prefecture}">東京都</td></tr>
                        <tr><th>住所（市区町村名）</th><td th:text="${registerForm.city}">千代田区</td></tr>
                        <tr><th>住所（番地・ビル名）</th><td th:text="${registerForm.addressLine}">丸の内1-1-1 ○○ビル 5F</td></tr>
                        <tr><th>お届け先階数</th><td th:text="${registerForm.deliveryFloorDisplay}">5階</td></tr>
                        <tr><th>エレベーターの有無</th><td th:text="${registerForm.hasElevatorLabel}">あり</td></tr>
                        <tr><th>日中連絡可能な電話番号</th><td th:text="${registerForm.daytimePhone}">0311111111</td></tr>
                        <tr><th>FAX</th><td th:text="${#strings.isEmpty(registerForm.fax) ? '-' : registerForm.fax}">-</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="actions" style="justify-content:flex-end; margin-top:14px;">
                <a class="btn" href="/members/register">入力へ戻る</a>
                <form th:action="@{/members/register}" method="post" style="margin:0;">
                    <button class="btn btn--cart-action" type="submit">会員登録を確定する</button>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>
</div>
<th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>
</html>
