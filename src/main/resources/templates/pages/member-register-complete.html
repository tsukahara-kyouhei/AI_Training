<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout/head :: head('会員登録完了 | OFFICE ORDER', '')}"></head>
<body class="is-logged-in">
<div class="page">
    <div th:replace="~{fragments/layout/header :: header}"></div>
    <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>

    <main class="main">
        <div class="container">
            <div th:replace="~{fragments/common/breadcrumb :: breadcrumb('トップ > 会員登録 > 会員登録完了')}"></div>
            <h1 class="page-title">会員登録完了</h1>

            <div class="card">
                <div class="card__pad">
                    <div class="kvs">
                        <span class="kv">会員ID: <strong th:text="${registeredMemberCode}">MEM0001234</strong></span>
                    </div>
                    <p class="muted" style="margin:12px 0 0; line-height:1.8;">
                        会員登録が完了しました。<br>
                        ご登録メールアドレス宛に完了メールを送信しました。
                    </p>
                </div>
            </div>

            <div class="actions" style="justify-content:flex-end; margin-top:14px;">
                <a class="btn" href="/">トップへ戻る</a>
                <a class="btn btn--cart-action" href="/mypage/orders">購入履歴を見る</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>
</div>
<th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>
</html>
