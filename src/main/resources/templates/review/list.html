<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout/head :: head('レビュー一覧 | OFFICE ORDER', 'product')}"></head>
<body>
<div class="page">
    <div th:replace="~{fragments/layout/header :: header}"></div>
    <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>

    <main class="main">
        <div class="container">
            <div th:replace="~{fragments/common/breadcrumb :: breadcrumb('トップ > レビュー一覧')}"></div>
            <h1 class="page-title">商品レビュー</h1>

            <div class="card" style="margin-bottom:14px;">
                <div class="card__pad">
                    <div class="layout-2col" style="gap:20px; align-items:center;">
                        <div>
                            <p class="section__title" style="margin:0 0 8px;">平均評価</p>
                            <p class="page-title" style="margin:0; font-size:2rem;">
                                <span th:text="${reviewSummary.averageRating != null} ? ${reviewSummary.averageRating} : '0.0'">4.2</span>
                            </p>
                        </div>
                        <div>
                            <p class="section__title" style="margin:0 0 8px;">レビュー件数</p>
                            <p class="page-title" style="margin:0; font-size:1.5rem;" th:text="${reviewSummary.reviewCount} + ' 件'">12 件</p>
                        </div>
                        <div class="actions" style="margin-top:0; justify-content:flex-end;">
                            <a class="btn btn--primary" th:href="@{/products/{productId}/reviews/new(productId=${reviewPage.productId})}">レビューを書く</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card" style="margin-bottom:14px;" th:if="${reviewPage.items == null or #lists.isEmpty(reviewPage.items)}">
                <div class="card__pad">
                    <p class="muted" style="margin:0;">まだレビューがありません。</p>
                </div>
            </div>

            <div th:each="review : ${reviewPage.items}">
                <div class="card" style="margin-bottom:14px;">
                    <div class="card__pad">
                        <div class="layout-2col" style="gap:12px; align-items:flex-start;">
                            <div>
                                <div class="kvs" style="gap:6px; display:flex; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
                                    <label class="kv" style="margin:0;">評価</label>
                                    <span th:each="i : ${#numbers.sequence(1, review.rating)}" class="material-icons" style="color:#ef6c00;">star</span>
                                    <span th:each="i : ${#numbers.sequence(review.rating + 1, 5)}" class="material-icons" style="color:#cbd5e1;">star_border</span>
                                </div>
                                <h2 class="section__title" style="margin:0 0 10px; font-size:1.2rem;" th:text="${review.title != null && !review.title.isEmpty() ? review.title : 'タイトルなし'}">レビュータイトル</h2>
                                <p class="muted" style="margin:0 0 10px;" th:text="${review.memberName} + ' / ' + ${#temporals.format(review.createdAt, 'yyyy/MM/dd')}">会員名 / 2026/08/12</p>
                                <p style="margin:0; white-space:pre-wrap;" th:text="${review.body}">レビュー本文が入ります。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="actions" style="margin-top:16px;">
                <a class="btn" th:href="@{/products/{productId}(productId=${reviewPage.productId})}">商品詳細に戻る</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>
</div>

<th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>
</html>
