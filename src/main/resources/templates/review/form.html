<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout/head :: head('レビュー投稿 | OFFICE ORDER', 'product')}"></head>
<body>
<div class="page">
    <div th:replace="~{fragments/layout/header :: header}"></div>
    <div th:replace="~{fragments/layout/notice-bar :: noticeBar}"></div>

    <main class="main">
        <div class="container">
            <div th:replace="~{fragments/common/breadcrumb :: breadcrumb('トップ > レビュー投稿')}"></div>
            <h1 class="page-title">レビュー投稿</h1>

            <form class="form" th:action="@{/products/{productId}/reviews(productId=${reviewForm.productId})}" th:object="${reviewForm}" method="post">
                <input type="hidden" th:field="*{productId}">

                <div class="card" style="margin-bottom:14px;">
                    <div class="card__pad">
                        <div class="field">
                            <label>評価 <span class="req">必須</span></label>
                            <div class="kvs" style="gap:10px; flex-wrap:wrap;">
                                <label class="kv" th:each="value : ${#numbers.sequence(1, 5)}">
                                    <input type="radio" th:field="*{rating}" th:value="${value}">
                                    <span th:text="${value} + ' 点'">1 点</span>
                                </label>
                            </div>
                            <div class="error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                        </div>

                        <div class="field">
                            <label>タイトル</label>
                            <input type="text" th:field="*{title}" placeholder="例：組み立てがスムーズでした">
                            <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="field">
                            <label>本文 <span class="req">必須</span></label>
                            <textarea th:field="*{body}" rows="8" placeholder="レビュー本文を入力してください"></textarea>
                            <div class="error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></div>
                        </div>
                    </div>
                </div>

                <div class="actions" style="justify-content:flex-end; gap:12px;">
                    <a class="btn" th:href="@{/products/{productId}/reviews(productId=${reviewForm.productId})}">一覧へ戻る</a>
                    <button class="btn btn--primary" type="submit">投稿する</button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/layout/footer :: footer}"></div>
</div>

<th:block th:replace="~{fragments/layout/scripts :: commonScripts}"></th:block>
</body>
</html>
