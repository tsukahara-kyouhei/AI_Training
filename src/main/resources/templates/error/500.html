<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout/head :: head('システムエラー | OFFICE ORDER', 'error')}">
</head>

<body>
    <div class="page error-page">
        <main class="main error-page__main">
            <div class="container error-page__container">
                <section class="card error-panel" aria-labelledby="error-title">
                    <div class="card__pad error-panel__pad">
                        <p class="error-panel__status" th:text="${statusCode}">500</p>
                        <h1 class="page-title error-panel__title" id="error-title" th:text="${errorTitle}">
                            システムエラーが発生しました</h1>
                        <p class="error-panel__message" th:text="${errorMessage}">時間をおいて再度お試しください。</p>
                        <p class="error-panel__note">
                            改善しない場合は、お問い合わせ時に以下の受付番号をお知らせください。
                        </p>

                        <dl class="error-panel__meta">
                            <div class="error-panel__meta-row">
                                <dt>受付番号</dt>
                                <dd th:text="${requestId}">request-id</dd>
                            </div>
                            <div class="error-panel__meta-row">
                                <dt>アクセス先</dt>
                                <dd th:text="${errorPath}">/products/1</dd>
                            </div>
                        </dl>

                        <div class="actions error-panel__actions">
                            <a class="btn btn--cart-action" href="/">トップへ戻る</a>
                            <a class="btn" href="/contact">お問い合わせ</a>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>

</html>
